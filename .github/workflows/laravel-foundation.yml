name: Laravel foundation checks
on:
  push:
    branches: ['platform/laravel-foundation']
permissions:
  contents: read
jobs:
  php-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: luxurry_test
          MARIADB_ROOT_PASSWORD: isolated-ci-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: platform
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ${{ matrix.database == 'mysql' && 'luxurry_test' || ':memory:' }}
      DB_USERNAME: root
      DB_PASSWORD: isolated-ci-password
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, fileinfo, gd, pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Initialize test environment
        run: cp .env.example .env
      - name: Resolve foundation dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Validate project metadata
        run: composer validate --no-check-lock
      - name: PHP syntax checks
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Run permissions, catalog and contact tests
        run: php artisan test
      - name: Check production cache compilation
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan optimize:clear
      - name: Dependency security advisory check
        run: composer audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-lock-${{ matrix.database }}
          path: platform/composer.lock
          if-no-files-found: ignore
